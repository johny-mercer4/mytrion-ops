<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- data: URI — Vite base './' rewrites /favicon.svg → ./favicon.svg, which 404s on
         deep SPA routes like /main/salesmytrion (browser resolves /main/favicon.svg). -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22grad%22%20x1=%220%25%22%20y1=%220%25%22%20x2=%22100%25%22%20y2=%22100%25%22%3E%3Cstop%20offset=%220%25%22%20stop-color=%22%2324C6DC%22%20/%3E%3Cstop%20offset=%2265%25%22%20stop-color=%22%2324C6DC%22%20/%3E%3Cstop%20offset=%22100%25%22%20stop-color=%22%23FF8008%22%20/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d=%22M15%2C85%20L15%2C25%20L40%2C65%20L50%2C80%20L60%2C65%20L85%2C25%20L85%2C85%22%20fill=%22none%22%20stroke=%22url(%23grad)%22%20stroke-width=%2214%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E"
    />
    <title>Mytrion Horizon</title>
    <!-- Two families, SELF-HOSTED. @font-face lives in src/styles/fonts.css; the woff2 files are
         emitted to a stable, unhashed assets/fonts/ path by the assetFileNames rule in
         vite.config.ts. This replaces a third-party stylesheet plus two cross-origin preconnects.

         Preload only the two faces that paint above the fold: the Space Grotesk variable latin
         file and Space Mono 400. latin-ext and Mono 700 are demand-loaded via unicode-range and
         weight, and preloading them would waste 35 KB on the critical path.

         `crossorigin` is REQUIRED even though these are same-origin: fonts are always fetched in
         anonymous-mode CORS, so a preload without it lands in a different cache partition and the
         browser downloads the file TWICE.

         Root-absolute `/assets/…`, not `./assets/…` — correct at every route depth in the portal
         and it skips the 308 in src/plugins/errorHandler.ts. In the Zoho .zet widget sandbox this
         preload simply misses, which is a SOFT failure: the CSS @font-face still resolves, because
         url() inside a stylesheet resolves against the stylesheet's own URL, not the document's. -->
    <link
      rel="preload"
      href="/assets/fonts/space-grotesk-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/space-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script type="module" crossorigin src="./assets/index-oQxU9o5Z.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dpa2QcrV.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
