name: CI

# Code checks only: lint, typecheck, migrate (CI Postgres), tests (mocked vendors), build,
# and vendored-bundle / honor-system gates. No live EFS, Zoho, RingCentral, DWH, Telegram,
# or prod writes. Deploy is `.github/workflows/deploy.yml` (push to main / workflow_dispatch).
#
# Runs on `build` as well as `main`. Team flow is: branch -> PR to `build` -> merge -> `build` into
# `main` -> deploy. With main-only triggers every PR was reviewed with zero automated verification
# and CI first ran at merge-to-main, i.e. at deploy time, after the decision it should have informed.
on:
  push:
    branches: [main, build]
  pull_request:
    branches: [main, build]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Most of the suite is DB-backed route tests. Without a database they answer 503 and the
    # gate is meaningless, which is why the test step used to be advisory. pgvector/pg16 matches
    # docker-compose; migration 0000 creates the `vector` extension itself.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: octane
          POSTGRES_PASSWORD: octane
          POSTGRES_DB: octane_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MYTRION_OPS_DATABASE_URL: postgresql://octane:octane@localhost:5432/octane_assistant
      # Dummy values, not secrets. Routes behind a shared secret answer 503 when it is unset
      # (apiKeyAuth.ts, paymentsIngest.routes.ts), which makes auth assertions fail for the wrong
      # reason. Every other value the suite needs is pinned in vitest.config.ts.
      API_KEY: ci-test-api-key
      BILLING_INGEST_SECRET: ci-test-ingest-secret
      # CI checks code (and the deploy workflow deploys). It must not inherit live vendor
      # credentials from repo/org secrets — that is how a unit run starts calling EFS.
      EFS_WSDL_URL: ''
      EFS_GROUP_WSDL_URL: ''
      EFS_LOGIN: ''
      EFS_PASSWORD: ''
      SERVER_CRM_URL: ''
      SERVER_CRM_KEY: ''
      DWH_DATABASE_URL: ''
      OPENAI_API_KEY: ''
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CARRIER_BOT_TOKEN: ''
      ZOHO_CRM_REFRESH_TOKEN: ''
      ZOHO_DESK_REFRESH_TOKEN: ''
      RINGCENTRAL_JWT: ''
      COMPOSIO_API_KEY: ''
      FF_AUDIT_LOG_ENABLED: '0'
      FF_MANAGER_EFS_WRITES_ENABLED: '0'
      FF_COMPOSIO_ENABLED: '0'
      FF_ZOHO_MCP_ENABLED: '0'
      FF_DBT_MCP_ENABLED: '0'
      FF_JOBS_ENABLED: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          # Honor-system gates (conventional commits, file-size cap) diff against the merge base.
          fetch-depth: 0

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Branch NAMES too: the script warns instead of failing on the build -> main release PR,
          # whose commits were already gated on their way into build.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/ci/check-conventional-commits.sh

      - name: Source file size cap
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check-file-size.sh

      - name: Apply migrations
        run: pnpm db:migrate

      # Hard gate. Verified green end to end with only the env above and no .env file present:
      # 2409 passed, 1 skipped, 0 failed.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The vendored-bundle check diffs this branch against its merge base.
          fetch-depth: 0

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install web dependencies
        run: pnpm -C apps/mytrion-crm install --frozen-lockfile

      # Hard gate: the frontend tree typechecks clean. It was advisory because of in-flight WIP
      # errors that no longer exist.
      - name: Web typecheck
        run: pnpm -C apps/mytrion-crm typecheck

      - name: Web test
        run: pnpm -C apps/mytrion-crm test

      # Render serves the COMMITTED bundle in apps/mytrion-crm/app and never runs Vite, so a PR
      # that changes src without rebuilding looks merged on GitHub while production shows the old
      # screen (the EFS Balance tile, PR #149). This compares which paths a PR touched rather than
      # rebuilding and diffing bytes, so it cannot fail for environment-dependent build output.
      - name: Vendored bundle is rebuilt
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three-dot: diff from the merge base, i.e. exactly what this PR changed — not whatever
          # else landed on the base branch meanwhile.
          changed=$(git diff --name-only "$BASE...$HEAD")
          # Test files under src/ never reach the bundle, so they must not demand a rebuild.
          src_changed=$(echo "$changed" \
            | grep '^apps/mytrion-crm/src/' \
            | grep -vE '\.test\.(ts|tsx)$|/__tests__/' \
            | grep -c . || true)
          app_changed=$(echo "$changed" | grep -c '^apps/mytrion-crm/app/' || true)
          echo "mytrion-crm src files changed (excluding tests): $src_changed"
          echo "mytrion-crm app files changed: $app_changed"
          if [ "$src_changed" -gt 0 ] && [ "$app_changed" -eq 0 ]; then
            echo ""
            echo "::error::This PR changes apps/mytrion-crm/src but does not update the committed"
            echo "::error::bundle in apps/mytrion-crm/app. Production serves that bundle, so this"
            echo "::error::change would merge without altering the live UI."
            echo "::error::Run 'pnpm build:widget' and commit apps/mytrion-crm/app in this PR."
            exit 1
          fi
          echo "Bundle check OK."

      # Same gate for the Telegram mini-app. Production serves apps/mini-app/app, not Vite.
      - name: Mini-app vendored bundle is rebuilt
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          src_changed=$(echo "$changed" \
            | grep '^apps/mini-app/src/' \
            | grep -vE '\.test\.(ts|tsx)$|/__tests__/' \
            | grep -c . || true)
          app_changed=$(echo "$changed" | grep -c '^apps/mini-app/app/' || true)
          echo "mini-app src files changed (excluding tests): $src_changed"
          echo "mini-app app files changed: $app_changed"
          if [ "$src_changed" -gt 0 ] && [ "$app_changed" -eq 0 ]; then
            echo ""
            echo "::error::This PR changes apps/mini-app/src but does not update the committed"
            echo "::error::bundle in apps/mini-app/app. Production serves that bundle, so this"
            echo "::error::change would merge without altering the live mini-app."
            echo "::error::Run 'pnpm -C apps/mini-app build' and commit apps/mini-app/app in this PR."
            exit 1
          fi
          echo "Mini-app bundle check OK."

  # Fail-closed: main only accepts PRs from `build`. Feature branches go to build first.
  # Always runs on pull_request so a required check is not "skipped" on PRs into build.
  # Does not change verify / web. Direct pushes to main are a GitHub Settings rule, not this job.
  main-from-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Main accepts only the build branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "PR $HEAD_REF -> $BASE_REF"
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "build" ]; then
            echo "::error::PRs targeting main must come from the build branch (head is '$HEAD_REF')."
            echo "::error::Open a PR to build first; promote with a PR from build to main."
            exit 1
          fi
